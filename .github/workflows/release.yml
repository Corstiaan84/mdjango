name: release

# Build the django-mdjango wheel + sdist and publish to TestPyPI when a version tag (vX.Y.Z) is
# pushed. hatch-vcs derives the version from the tag. Publishing uses Trusted Publishing (OIDC) —
# no stored API token. Mirrors walden-cli's release workflow, retargeted at TestPyPI while mdjango
# is rehearsing its release; switch repository-url to real PyPI (and register the publisher there)
# when promoting.
#
# One-time setup on TestPyPI before the first release: register this repo + this workflow as a
# trusted publisher for the `django-mdjango` project (a "pending publisher" works before the
# project exists).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags — needs full history + tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Provision the target Python
        run: uv python install 3.14

      - name: Build the wheel + sdist
        run: uv build

      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
