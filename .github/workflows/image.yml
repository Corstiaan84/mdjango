name: image

# Build the mdjango docs-site image (site/, deploy shape A) and push it to a PRIVATE ghcr.io
# package on every push to main — docs cadence, decoupled from the package version (release.yml).
# The package inherits the repo's visibility (private) and stays private even after the repo goes
# public; change it deliberately in the package settings if that ever needs to flip.
#
# The VPS pulls this private image with credentials stored via `walden registry login`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the image build runs hatch-vcs — needs full history + tags

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/corstiaan84/mdjango-site
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
